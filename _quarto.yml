    - slides/lec-02_background.qmd
    - slides/lec-03_wrangle.qmd
    - slides/lec-03_desc-viz.qmd
    - slides/lec-03_desc-viz_JAMOVI.qmd
    - slides/lec-04_design-inference.qmd
    
    
