# Builds the site with Quarto only (no R). R output comes from the committed
# _freeze/ folder, so run `quarto render` on your computer and commit _freeze/
# before pushing. If a page's R code changed and wasn't re-rendered locally,
# this build fails on purpose.
name: Build and Deploy Website

on:
  push:
    branches: main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish Website
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
